[project]
name = "tessera"
version = "0.1.0"
description = "CAD geometry data & model-evaluation platform (CPU, mesh-first)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "trimesh>=4.0",
  "numpy>=1.26",
  "scipy>=1.11",
  "networkx>=3.0",
  "xgboost>=2.0",
  "scikit-learn>=1.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tessera"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]  # broad try/except in the pipeline is intentional (robustness)
